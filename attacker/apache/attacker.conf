# The attacker's Apache: it answers as social.lab on 443 using the
# self-signed certificate from make_cert.sh, and proxies to the harvester
# app on 127.0.0.1:8000. This is a straight impersonation of social.lab's
# own vhost - the only real difference is whose certificate it presents.

<VirtualHost *:80>
    ServerName social.lab
    Redirect permanent / https://social.lab/
</VirtualHost>

<VirtualHost *:443>
    ServerName social.lab

    SSLEngine on
    SSLCertificateFile /app/server/cert.pem
    SSLCertificateKeyFile /app/server/key.pem

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/
    RequestHeader set X-Forwarded-Proto https
</VirtualHost>

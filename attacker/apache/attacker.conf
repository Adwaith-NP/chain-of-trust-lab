# The attacker's Apache: it answers as social.lab on 443 and proxies to the
# harvester app on 127.0.0.1:8000. This is a straight impersonation of
# social.lab's own vhost - the only real difference is whose certificate it
# presents.
#
# The certificate it serves lives in /app/live/. mode.sh swaps that between:
#   option 1  the self-signed cert (/app/server)        -> browser warns
#   option 2  the forged CA-signed cert (/app/server-forged) -> no warning
# Default is the self-signed cert, so the lab behaves as before out of the box.

<VirtualHost *:80>
    ServerName social.lab
    Redirect permanent / https://social.lab/
</VirtualHost>

<VirtualHost *:443>
    ServerName social.lab

    SSLEngine on
    SSLCertificateFile /app/live/cert.pem
    SSLCertificateKeyFile /app/live/key.pem

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/
    RequestHeader set X-Forwarded-Proto https
</VirtualHost>

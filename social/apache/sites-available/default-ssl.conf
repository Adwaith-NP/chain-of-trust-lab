# SEED Task 4 - the HTTPS site for SEEDPKILab2020.com.
# Enabled with "a2ensite default-ssl" (seed/task4_apache.sh). The key from
# Task 2 is encrypted, so Apache asks for its passphrase when it starts.
# When nobody is there to answer (the container starting up), Apache starts
# with -D NO_SEED and leaves this site out until seed/start_web.sh.
<IfFile /app/seed/server.crt>
<IfDefine !NO_SEED>

<VirtualHost *:80>
    ServerName seedpkilab2020.com
    Redirect permanent / https://seedpkilab2020.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName seedpkilab2020.com

    # The handout's example serves files from a DocumentRoot. This website
    # is the Social Lab app, so Apache passes each request to it instead.
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/
    RequestHeader set X-Forwarded-Proto https

    SSLEngine On
    SSLCertificateFile /app/seed/server.crt
    SSLCertificateKeyFile /app/seed/server.key
</VirtualHost>

</IfDefine>
</IfFile>

# Loaded first (sites-enabled/*.conf are read in name order), so the virtual
# hosts here are the defaults: they answer every request whose name matches
# no site - a request by IP, or for a name this server doesn't host.
ServerName localhost
CustomLog ${APACHE_LOG_DIR}/access.log vhost_combined

<VirtualHost *:80>
    ServerName catch-all.invalid
    ErrorDocument 421 "This server only answers as https://social.lab or https://seedpkilab2020.com"
    RewriteEngine On
    RewriteRule ^ - [R=421,L]
</VirtualHost>

# HTTPS needs a certificate even to say no; social.lab's is used.
<IfFile /app/server/cert.pem>
<VirtualHost *:443>
    ServerName catch-all.invalid
    SSLEngine on
    SSLCertificateFile /app/server/cert.pem
    SSLCertificateKeyFile /app/server/key.pem
    ErrorDocument 421 "This server only answers as https://social.lab or https://seedpkilab2020.com"
    RewriteEngine On
    RewriteRule ^ - [R=421,L]
</VirtualHost>
</IfFile>

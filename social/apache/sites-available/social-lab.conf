# Social Lab at social.lab. Its certificate comes from the CA's enrollment
# (enroll.sh saved it in /app/server). Apache does HTTPS and passes each
# request to the app on 127.0.0.1:8000.

<VirtualHost *:80>
    ServerName social.lab
    <IfFile /app/server/cert.pem>
        Redirect permanent / https://social.lab/
    </IfFile>
    <IfFile !/app/server/cert.pem>
        ErrorDocument 503 "Social Lab only runs over HTTPS at https://social.lab, which isn't set up yet."
        RewriteEngine On
        RewriteRule ^ - [R=503,L]
    </IfFile>
</VirtualHost>

<IfFile /app/server/cert.pem>
<VirtualHost *:443>
    ServerName social.lab

    SSLEngine on
    SSLCertificateFile /app/server/cert.pem
    SSLCertificateKeyFile /app/server/key.pem

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/
    RequestHeader set X-Forwarded-Proto https
</VirtualHost>
</IfFile>
